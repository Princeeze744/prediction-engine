# QuantSport daily robot: collects matches, builds today's tickets and publishes them. No PC needed.
# Runs Monday to Saturday at about 06:10 Lagos time. Can also be started by hand from the Actions tab ("Run workflow").
name: Daily tickets
on:
  schedule:
    - cron: '10 5 * * 1-6'      # 05:10 UTC = 06:10 Lagos
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-tickets
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      QS_DATA: ${{ github.workspace }}\data
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install Python packages
        run: pip install -r tools/requirements.txt
      - name: Check the API key and set Lagos time
        shell: pwsh
        run: |
          if (-not $env:APIFOOTBALL_KEY) { Write-Error 'APIFOOTBALL_KEY secret is missing. Add it under Settings > Secrets and variables > Actions.'; exit 1 }
          tzutil /s "W. Central Africa Standard Time"
          Get-Date
      - name: Results for the last 2 days
        shell: pwsh
        run: ./tools/collectors/QS_Collect_APIFootball.ps1 -DaysBack 2 -OutDir "$env:QS_DATA"
      - name: Today's pre-match prices
        shell: pwsh
        run: ./tools/collectors/QS_Today_AllMarkets.ps1 -OutDir "$env:QS_DATA\prematch"
      - name: Build today's tickets, free picks and No Draw list
        shell: pwsh
        run: |
          python tools/build_models.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$env:QS_DATA\daily10\$(Get-Date -Format 'yyyy-MM-dd').json")) { Write-Error "Today's tickets were not created."; exit 1 }
      - name: Save and publish
        shell: pwsh
        run: |
          # saved under the repository owner's name so Vercel accepts it and republishes the site
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data public/research/models.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Nothing new to publish.'; exit 0 }
          git commit -m "Daily update $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
          git push
