# QuantSport robot. No PC needed.
#  - Morning (every day, Sunday included): collects matches, builds and freezes the day's tickets, free picks and No Draw list.
#  - Through the day (every day): refreshes scores so every match is marked Won/Lost soon after it ends.
# Can also be started by hand from the Actions tab ("Run workflow"). Robot version 5.
name: Daily tickets
on:
  schedule:
    # GitHub often starts scheduled runs late, so the morning is asked three times. The first run that works
    # freezes the day's tickets; later runs only refresh results and never change them.
    - cron: '10 4 * * *'        # 05:10 Lagos
    - cron: '10 5 * * *'        # 06:10 Lagos
    - cron: '30 6 * * *'        # 07:30 Lagos
    - cron: '5 9-22 * * *'      # results refresh every hour, 10:05 to 23:05 Lagos
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-tickets
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      QS_DATA: ${{ github.workspace }}\data
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install Python packages
        run: pip install -r tools/requirements.txt
      - name: Check the API key and set Lagos time
        shell: pwsh
        run: |
          if (-not $env:APIFOOTBALL_KEY) { Write-Error 'APIFOOTBALL_KEY secret is missing. Add it under Settings > Secrets and variables > Actions.'; exit 1 }
          $k = $env:APIFOOTBALL_KEY -replace '\s', ''
          Write-Host "Key check: $($k.Length) characters after cleaning ($($env:APIFOOTBALL_KEY.Length) as saved). Robot version 5."
          tzutil /s "W. Central Africa Standard Time"
      - name: Latest scores (today and yesterday)
        shell: pwsh
        run: |
          python tools/refresh_results.py
          if ($LASTEXITCODE -ne 0) { Write-Host 'Score refresh failed this time - carrying on with what we have.' }
          exit 0
      - name: Full results for the last 2 days
        shell: pwsh
        run: ./tools/collectors/QS_Collect_APIFootball.ps1 -DaysBack 2 -OutDir "$env:QS_DATA"
      - name: Today's pre-match prices (only until the day's tickets are frozen)
        shell: pwsh
        run: |
          $today = Get-Date -Format 'yyyy-MM-dd'
          if (Test-Path "$env:QS_DATA\daily10\$today.json") { Write-Host "Tickets for $today are already frozen - skipping."; exit 0 }
          ./tools/collectors/QS_Today_AllMarkets.ps1 -OutDir "$env:QS_DATA\prematch"
      - name: Build tickets, free picks, No Draw list and settle results
        shell: pwsh
        run: |
          python tools/build_models.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $today = Get-Date -Format 'yyyy-MM-dd'
          if (-not (Test-Path "$env:QS_DATA\daily10\$today.json")) { Write-Error "Today's tickets were not created."; exit 1 }
      - name: Save and publish
        shell: pwsh
        run: |
          # saved under the repository owner's name so Vercel accepts it and republishes the site
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data public/research/models.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Nothing new to publish.'; exit 0 }
          git commit -m "Update $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
          git pull --rebase
          git push
